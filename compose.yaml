name: kazan-courts

x-django-environment: &django-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: kazan_courts_dev
  DB_USER: kazan_dev
  DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  WEATHER_NETWORK_ENABLED: ${WEATHER_NETWORK_ENABLED:-0}

services:
  migrate:
    build: .
    environment: *django-environment
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    volumes:
      - compose_postgres_alpine_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    environment: *django-environment
    ports:
      - "127.0.0.1:${KAZAN_HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - compose_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s

  publisher:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "publish_weather"]
    environment: *django-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "consume_weather"]
    environment: *django-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "schedule_weather"]
    environment: *django-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  compose_postgres_alpine_data:
  compose_kafka_data:
