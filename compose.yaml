name: kazan-courts

x-django-environment: &django-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: kazan_courts_dev
  DB_USER: kazan_dev
  DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://monitoring:9000/v1/spans}
  WEATHER_NETWORK_ENABLED: ${WEATHER_NETWORK_ENABLED:-0}

services:
  monitoring:
    build: .
    command: ["python", "-m", "config.telemetry_server"]
    ports:
      - "127.0.0.1:${KAZAN_MONITOR_PORT:-19006}:9000"
    volumes:
      - compose_observability_data:/var/lib/kazan-observability
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    environment:
      <<: *django-environment
      KAZAN_SERVICE: migrate
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      monitoring:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    volumes:
      - compose_postgres_alpine_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    environment:
      <<: *django-environment
      KAZAN_SERVICE: web
    ports:
      - "127.0.0.1:${KAZAN_HTTP_PORT:-8000}:8000"
    depends_on:
      monitoring:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - compose_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s

  publisher:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "publish_weather"]
    environment:
      <<: *django-environment
      KAZAN_SERVICE: publisher
    depends_on:
      monitoring:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "consume_weather"]
    environment:
      <<: *django-environment
      KAZAN_SERVICE: consumer
    depends_on:
      monitoring:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "schedule_weather"]
    environment:
      <<: *django-environment
      KAZAN_SERVICE: scheduler
    depends_on:
      monitoring:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  restore-db:
    profiles: [recovery]
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    volumes:
      - compose_restore_postgres_alpine_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  restore-kafka:
    profiles: [recovery]
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://restore-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@restore-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - compose_restore_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s

  restore-web:
    profiles: [recovery]
    build: .
    environment:
      <<: *django-environment
      DB_HOST: restore-db
      KAFKA_BOOTSTRAP_SERVERS: restore-kafka:9092
      KAZAN_SERVICE: restore-web
      KAZAN_RECOVERY_MODE: "1"
    depends_on:
      restore-db:
        condition: service_healthy
      restore-kafka:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAZAN_RESTORE_PORT:-18016}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  restore-publisher:
    profiles: [recovery]
    build: .
    environment:
      <<: *django-environment
      DB_HOST: restore-db
      KAFKA_BOOTSTRAP_SERVERS: restore-kafka:9092
      KAZAN_SERVICE: restore-publisher
      KAZAN_RECOVERY_MODE: "1"
    depends_on:
      restore-db:
        condition: service_healthy
      restore-kafka:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    command: ["python", "manage.py", "publish_weather"]

  restore-consumer:
    profiles: [recovery]
    build: .
    environment:
      <<: *django-environment
      DB_HOST: restore-db
      KAFKA_BOOTSTRAP_SERVERS: restore-kafka:9092
      KAZAN_SERVICE: restore-consumer
      KAZAN_RECOVERY_MODE: "1"
    depends_on:
      restore-db:
        condition: service_healthy
      restore-kafka:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    command: ["python", "manage.py", "consume_weather"]

  restore-scheduler:
    profiles: [recovery]
    build: .
    environment:
      <<: *django-environment
      DB_HOST: restore-db
      KAFKA_BOOTSTRAP_SERVERS: restore-kafka:9092
      KAZAN_SERVICE: restore-scheduler
      KAZAN_RECOVERY_MODE: "1"
    depends_on:
      restore-db:
        condition: service_healthy
      restore-kafka:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    command: ["python", "manage.py", "schedule_weather"]

  upgrade-db:
    profiles: [verification]
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    volumes:
      - compose_upgrade_postgres_alpine_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  upgrade-web:
    profiles: [verification]
    build: .
    environment:
      <<: *django-environment
      DB_HOST: upgrade-db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAZAN_SERVICE: web
      KAZAN_RECOVERY_MODE: "1"
    depends_on:
      upgrade-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAZAN_UPGRADE_PORT:-18017}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  compose_postgres_alpine_data:
  compose_kafka_data:
  compose_observability_data:
  compose_restore_postgres_alpine_data:
  compose_restore_kafka_data:
  compose_upgrade_postgres_alpine_data:
