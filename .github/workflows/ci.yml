name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/hw05-kazancourts-production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django-check:
    name: django-check
    # GitHub-hosted only: no self-hosted, workstation or external service.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      COMPOSE_PROJECT_NAME: kc-hw05-ci-${{ github.run_id }}-${{ github.run_attempt }}
      WEATHER_NETWORK_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.13.0"

      - name: Verify CI result gates
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts', pattern='test_ci_production.py')
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          complete = discovered >= 14 and result.testsRun == discovered
          passed = result.wasSuccessful() and not (result.skipped or result.expectedFailures)
          raise SystemExit(0 if complete and passed else 1)
          PY

      - name: Prepare new isolated Compose project
        id: prepare
        run: >-
          python3 scripts/ci_production.py prepare
          --state-dir "$RUNNER_TEMP/kazan-private"
          --artifacts "$RUNNER_TEMP/kazan-safe-results"

      - name: Build, run, fail dependencies and test P01-P13
        id: tests
        timeout-minutes: 38
        run: >-
          python3 scripts/ci_production.py run
          --state-dir "$RUNNER_TEMP/kazan-private"
          --artifacts "$RUNNER_TEMP/kazan-safe-results"

      - name: Audit secrets and clean only this test project
        id: finalize
        if: always()
        timeout-minutes: 12
        run: >-
          python3 scripts/ci_production.py finalize
          --state-dir "$RUNNER_TEMP/kazan-private"
          --artifacts "$RUNNER_TEMP/kazan-safe-results"

      - name: Explicit PASS or FAIL summary
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'kazan-safe-results'
          destination.mkdir(exist_ok=True)
          passed = all(os.environ[name] == 'success' for name in
                       ('PREPARE_OUTCOME', 'TESTS_OUTCOME', 'FINALIZE_OUTCOME'))
          status = 'PASS' if passed else 'FAIL'
          with (destination / 'summary.txt').open('a') as output:
              output.write(f'{status} overall CI\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### KazanCourts P01-P13: ' + status + '\n\n')
              output.write('```text\n' + (destination / 'summary.txt').read_text() + '```\n')
          print(status + ' overall CI')
          raise SystemExit(0 if passed else 1)
          PY

      - name: Upload audited results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kazancourts-p01-p13-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kazan-safe-results/
          if-no-files-found: error
          retention-days: 14
