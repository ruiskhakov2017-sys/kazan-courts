name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django-check:
    name: django-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Used only by this temporary CI service.
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.2.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - "127.0.0.1:9092:9092"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 18
          --health-start-period 30s

    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: kazan_test
      KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:9092"
      KAFKA_INTEGRATION: "1"
      WEATHER_NETWORK_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.13.0"

      - name: Test operator interface
        run: node --test bookings/tests/operator_queue_ui.test.js

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prepare and verify Kafka topic
        run: |
          docker exec "${{ job.services.kafka.id }}" /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server 127.0.0.1:9092 --create --if-not-exists \
            --topic booking.weather.v1 --partitions 1 --replication-factor 1
          python - <<'PY'
          import os
          from kafka import KafkaConsumer

          consumer = KafkaConsumer(bootstrap_servers=os.environ["KAFKA_BOOTSTRAP_SERVERS"],
                                   request_timeout_ms=10000)
          try:
              partitions = consumer.partitions_for_topic("booking.weather.v1")
              if partitions != {0}:
                  raise SystemExit(f"Kafka topic must have one partition: {partitions}")
              print("Runner connected to Kafka; booking.weather.v1 has one partition")
          finally:
              consumer.close()
          PY

      - name: Create CI test role
        env:
          POSTGRES_PASSWORD: ci-bootstrap-only
        run: |
          python - <<'PY'
          import os
          import secrets

          import psycopg
          from psycopg import sql

          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}", flush=True)
          with psycopg.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname="postgres",
              user="postgres",
              password=os.environ["POSTGRES_PASSWORD"],
              autocommit=True,
          ) as connection:
              connection.execute(
                  sql.SQL(
                      "CREATE ROLE kazan_test LOGIN NOSUPERUSER NOCREATEROLE "
                      "CREATEDB NOREPLICATION NOBYPASSRLS PASSWORD {}"
                  ).format(sql.Literal(password))
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DB_PASSWORD={password}\n")
          print("CI test role created")
          PY

      - name: Check Python, Django, database and home page
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python -m compileall -q manage.py config bookings test_database.py
          python manage.py check
          python manage.py makemigrations --check --dry-run
          set -o pipefail
          python manage.py test test_database bookings --verbosity 2 --noinput 2>&1 | tee "$RUNNER_TEMP/django-tests.log"
          python - <<'PY'
          import os
          from pathlib import Path

          log = (Path(os.environ["RUNNER_TEMP"]) / "django-tests.log").read_text(encoding="utf-8")
          names = (
              "test_invalid_record_is_redelivered_and_blocks_later_message",
              "test_forecast_outbox_real_broker_consumer_and_redelivery",
          )
          for name in names:
              marker = f"{name} (bookings.tests.test_kafka_pipeline.KafkaIntegrationTests.{name}) ... ok"
              if marker not in log:
                  raise SystemExit(f"Kafka integration test did not pass: {name}")
          print("Both real Kafka integration tests passed")
          PY
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django
          django.setup()

          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT EXISTS (SELECT 1 FROM pg_database WHERE datname = %s)",
                  ["test_kazan_courts"],
              )
              if cursor.fetchone()[0]:
                  raise SystemExit("Test database still exists after the test run")
          print("Test database removed: OK")

          from django.test import Client
          client = Client()
          response = client.get("/", HTTP_HOST="localhost")
          if response.status_code != 302 or response.url != "/login/?next=/":
              raise SystemExit("Anonymous GET / did not redirect to login")
          response = client.get("/login/", HTTP_HOST="localhost")

          if response.status_code != 200:
              raise SystemExit(f"GET /login/ returned {response.status_code}")
          if b"<h1>KazanCourts</h1>" not in response.content:
              raise SystemExit("Expected heading is missing")

          print("Anonymous GET /: login redirect; GET /login/: HTTP 200")
          PY
          test ! -e db.sqlite3
